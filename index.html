<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var standalone = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
        var visual = window.visualViewport;
        var h = window.innerHeight;
        if (standalone && ios) {
          h = Math.max(h, screen.height || 0);
        } else if (visual && visual.height) {
          h = visual.height + (visual.offsetTop || 0);
        }
        var root = document.documentElement;
        root.style.setProperty("--app-h", h + "px");
        root.style.setProperty("--app-top", "0px");
      })();
    </script>
    <meta name="theme-color" content="#00656D" />
    <meta name="description" content="Ozeril — заказы услуг рядом с вами" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ozeril" />
    <title>Ozeril</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
